<!DOCTYPE html>
<html lang="ja">
<head>

  <title>Pokémon GO 整理アシスタント</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <main id="view" class="view" aria-live="polite">
      <p class="loading">読み込み中…</p>
    </main>
    <nav class="tabbar" aria-label="メインメニュー">
      <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>ホーム</a>
      <a href="#/list" data-tab="list"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.2"/><circle cx="6" cy="16" r="3.2"/><circle cx="18" cy="16" r="3.2"/></svg>ポケモン</a>
      <a href="#/organize" data-tab="organize"><svg viewBox="0 0 24 24"><path d="M4 7h11M4 12h7M4 17h11M17 5l3 2-3 2M14 15l3 2-3 2" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>整理</a>

    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
